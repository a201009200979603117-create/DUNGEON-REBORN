
<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>心動的每一天</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- 主選單 -->
    <div id="menu">
        <div class="menu-overlay">
            <p class="menu-subtitle">MY YOUTH, MY STORY</p>

            <h1 class="menu-title">心動的每一天</h1>

            <p class="menu-description">
                有些相遇，會讓平凡的日子變得特別。
                <br>
                你的青春故事，從這裡開始。
            </p>

            <button id="start-button" onclick="startGame()">
                開始故事　→
            </button>
        </div>
    </div>

    <!-- 遊戲主畫面 -->
    <main id="game" style="display: none;">

        <button id="restart-button" onclick="restartGame()">
            重新開始
        </button>

        <!-- 女主角 -->
        <div id="character-area">
            <img
                id="character-image"
                src="images/heroine.png"
                alt="女主角"
            >
        </div>

        <!-- 劇情對話 -->
        <section id="dialogue-box">
            <h3 id="character-name">旁白</h3>

            <p id="dialogue">
                你走進教室，發現一位陌生的女孩坐在窗邊。
            </p>

            <div id="scene-progress">第 1 / 20 段</div>
        </section>

        <!-- 好感度 -->
        <section id="affection-panel">
            <p id="affection">好感度：0 / 100</p>

            <p id="affection-level">關係：陌生人</p>

            <div id="affection-bar">
                <div id="affection-fill"></div>
            </div>
        </section>

        <!-- 劇情選項由 script.js 自動建立 -->
        <div id="story-choices" style="display: none;"></div>

        <!-- 下一段劇情 -->
        <button
            id="next-button"
            onclick="nextDialogue()"
        >
            下一段 ▶
        </button>

        <!-- 結局 CG -->
        <div
            id="ending-cg"
            style="display: none;"
            onclick="advanceEndingCG()"
        >
            <img
                id="ending-cg-image"
                src=""
                alt="結局專屬插畫"
            >

            <div id="ending-dialogue-box">
                <h3 id="ending-cg-title">故事結局</h3>

                <p id="ending-cg-dialogue">
                    點擊畫面，揭開故事結局……
                </p>

                <span id="ending-cg-hint">
                    點擊畫面繼續 ▶
                </span>
            </div>
        </div>

    </main>

    <!-- JavaScript 放在 body 最後面 -->
    <script src="script.js"></script>
</body>
</html>
